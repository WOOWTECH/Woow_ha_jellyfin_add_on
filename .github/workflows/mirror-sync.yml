name: mirror-sync

# Nightly git sync: pulls latest from upstream, adds a snapshot of it to the
# `upstream` branch, then rebuilds `main` (patched) with our overlay files and
# the image: field rewrites applied on top.
#
# `main` only moves forward. Each sync rebuilds the tree from upstream and
# commits it on top of the previous `main`; it is never force-pushed.
# Woow_HA_App_Store pins published add-on snapshots by commit and accepts a
# new snapshot only when it descends from the one it already has, so a
# rewritten `main` would block every later release.
#
# Upstream's `.github` folder (its CI configuration) is not copied anywhere.
# GitHub does not let this workflow's token push workflow files, so an
# upstream change to its workflow files made the exact mirror fail every
# night (jellyfin from 2026-10-22). The `upstream` branch therefore holds
# upstream's source without `.github`, one snapshot commit per change, and
# is never force-pushed. Upstream tags are no longer copied either: they
# point at upstream commits, `.github` included. Same steps as the dnsmasq
# mirror (a30e5da).
#
# Differs from the Music Assistant / Matter Hub mirrors in one way: those
# upstreams are single-product store repos, so `main` can be the whole tree.
# This mirror's upstream carries add-ons we do not republish, so `main` is
# pruned to KEEP_SUBDIRS (see .mirror/config.env). The `upstream` branch is
# not pruned (it lacks only `.github`), so nothing is lost if we later want more.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: mirror-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (with full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Snapshot overlay files
        run: |
          set -e
          mkdir -p /tmp/overlay
          # Copy overlay (files we add on top of upstream). repository.yaml is
          # ours too, because pruning drops the upstream store manifest.
          [ -d .github ]          && cp -a .github         /tmp/overlay/
          [ -d .mirror ]          && cp -a .mirror         /tmp/overlay/
          [ -f README.md ]        && cp -a README.md       /tmp/overlay/
          [ -f repository.yaml ]  && cp -a repository.yaml /tmp/overlay/
          echo "Overlay snapshot:"; find /tmp/overlay -maxdepth 3 -type f

      - name: Load mirror config
        run: |
          set -a
          . .mirror/config.env
          set +a
          echo "UPSTREAM_URL=$UPSTREAM_URL"                 >> $GITHUB_ENV
          echo "UPSTREAM_BRANCH=$UPSTREAM_BRANCH"           >> $GITHUB_ENV
          echo "MIRROR_IMAGE_PREFIX=$MIRROR_IMAGE_PREFIX"   >> $GITHUB_ENV
          echo "KEEP_SUBDIRS=$KEEP_SUBDIRS"                 >> $GITHUB_ENV

      - name: Fetch upstream source and tags
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream --tags --prune --force

      - name: Update upstream source snapshot branch
        run: |
          set -euo pipefail
          # Upstream's tree without `.github`, built in a scratch index.
          export GIT_INDEX_FILE="$RUNNER_TEMP/upstream-snapshot.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "upstream/$UPSTREAM_BRANCH"
          git rm -r -q --cached --ignore-unmatch .github
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          parent=$(git rev-parse --verify -q refs/remotes/origin/upstream || true)
          if [ -n "$parent" ] && [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
            echo "Upstream snapshot unchanged."
            exit 0
          fi
          upstream_commit=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
          export GIT_AUTHOR_NAME="WOOWTECH Mirror Bot" GIT_COMMITTER_NAME="WOOWTECH Mirror Bot"
          export GIT_AUTHOR_EMAIL="woowtech-mirror-bot@designsmart.com.tw" GIT_COMMITTER_EMAIL="woowtech-mirror-bot@designsmart.com.tw"
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} \
            -m "[bot] upstream snapshot ${UPSTREAM_URL##*/}@${upstream_commit} without .github")
          # A normal push: the snapshot sits on top of the previous one.
          git push origin "$commit:refs/heads/upstream"

      - name: Rebuild main = upstream + prune + overlay + image patches
        run: |
          set -e
          # Keep `main` checked out and replace its index and work tree with
          # upstream's tree, so the commit below sits on top of the old main.
          git checkout main
          git read-tree --reset -u "upstream/$UPSTREAM_BRANCH"
          # Upstream's CI configuration is not part of the add-on.
          rm -rf .github

          # Prune to the add-on(s) we republish. Everything else in the
          # upstream tree is dropped from `main` only; `upstream` keeps it all.
          if [ -n "${KEEP_SUBDIRS:-}" ]; then
            echo "Pruning main to: $KEEP_SUBDIRS"
            for path in $(ls -A); do
              [ "$path" = ".git" ] && continue
              keep=0
              for k in $KEEP_SUBDIRS; do
                [ "$path" = "$k" ] && keep=1
              done
              if [ "$keep" = "0" ]; then
                echo "  - dropping $path"
                rm -rf -- "$path"
              fi
            done
            # Fail loudly rather than publishing an empty store.
            for k in $KEEP_SUBDIRS; do
              if [ ! -e "$k" ]; then
                echo "::error::KEEP_SUBDIRS entry '$k' not found in upstream tree — upstream may have renamed or removed it"
                exit 1
              fi
            done
          fi

          # Re-apply overlay
          cp -a /tmp/overlay/. .
          # Patch image: fields
          python3 .mirror/patch-image.py
          # Refresh last-sync stamp
          {
            echo "last_sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "upstream_url: $UPSTREAM_URL"
            echo "upstream_branch: $UPSTREAM_BRANCH"
            echo "upstream_commit: $(git rev-parse upstream/$UPSTREAM_BRANCH)"
            echo "mirror_image_prefix: $MIRROR_IMAGE_PREFIX"
            echo "keep_subdirs: $KEEP_SUBDIRS"
          } > .mirror/last-sync.yaml

      - name: Commit & push main
        run: |
          git config user.email "woowtech-mirror-bot@designsmart.com.tw"
          git config user.name  "WOOWTECH Mirror Bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes; skipping commit."
          else
            git commit -m "[bot] mirror sync $(date -u +%Y-%m-%d) — ${UPSTREAM_URL##*/}@${UPSTREAM_BRANCH}"
          fi
          git push origin main
